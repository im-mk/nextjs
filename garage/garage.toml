metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"
# Dev-only fixed secret; regenerate with `openssl rand -hex 32` for any shared/production environment.
rpc_secret = "9c3f7a2b6e1d4508a1f0c2b3d4e5f60718293a4b5c6d7e8f9012345678abcdef"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
root_domain = ".s3.garage.localhost"

[admin]
api_bind_addr = "[::]:3903"
# Dev-only fixed token; regenerate with `openssl rand -base64 32` for any shared/production environment.
admin_token = "dev-only-admin-token-do-not-use-in-production"
