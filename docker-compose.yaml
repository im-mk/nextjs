name: nextjs
services:
  db:
    container_name: db
    image: postgres:18.3
    volumes:
      # - db:/data/postgres # enable this line to persist data
      - ./database/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /data/postgres
    ports:
      - ${DB_EXTERNAL_PORT}:${DB_INTERNAL_PORT}
    networks:
      - network1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_USER -d $DB_NAME"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    container_name: liquibase
    image: liquibase/liquibase:5.0.1
    entrypoint:
      [
        "sh",
        "-c",
        "liquibase lpm list | grep postgresql || liquibase lpm add postgresql --global; liquibase update",
      ]
    # contexts: dev to seed data in dev environment
    command: --defaultsFile=liquibase.properties --contexts=dev update
    volumes:
      - ./database/liquibase.properties:/liquibase/liquibase.properties
      - ./database/changelog.yaml:/liquibase/changelog/changelog.yaml
      - ./database/sql:/liquibase/changelog/sql
      - ./database/seed:/liquibase/changelog/seed
      - ./database/dev:/liquibase/changelog/dev
    environment:
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://db:${DB_INTERNAL_PORT}/${DB_NAME}
      - LIQUIBASE_COMMAND_USERNAME=${DB_USER}
      - LIQUIBASE_COMMAND_PASSWORD=${DB_PASSWORD}
    networks:
      - network1
    depends_on:
      db:
        condition: service_healthy

  api:
    container_name: api
    build:
      context: ./api
      dockerfile: App.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=${DB_INTERNAL_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ObjectStorage__Provider=${OBJECT_STORAGE_PROVIDER}
      - ObjectStorage__Azure__ServiceUri=http://azurite:10000/${AZURITE_ACCOUNT_NAME}
      - ObjectStorage__Azure__PublicServiceUri=http://localhost:${AZURITE_BLOB_PORT}/${AZURITE_ACCOUNT_NAME}
      - ObjectStorage__Azure__AccountName=${AZURITE_ACCOUNT_NAME}
      - ObjectStorage__Azure__AccountKey=${AZURITE_ACCOUNT_KEY}
      - ObjectStorage__Azure__Container=${OBJECT_STORAGE_CONTAINER}
      - ObjectStorage__Aws__ServiceUrl=http://localstack:4566
      - ObjectStorage__Aws__PublicServiceUrl=http://localhost:${LOCALSTACK_PORT}
      - ObjectStorage__Aws__AccessKey=${AWS_ACCESS_KEY_ID}
      - ObjectStorage__Aws__SecretKey=${AWS_SECRET_ACCESS_KEY}
      - ObjectStorage__Aws__Bucket=${OBJECT_STORAGE_CONTAINER}
      - ObjectStorage__Aws__Region=${AWS_REGION}
      - ObjectStorage__Aws__ForcePathStyle=true
    ports:
      - ${EXTERNAL_PORT}:${INTERNAL_PORT}
    depends_on:
      db:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      azurite:
        condition: service_started
      localstack:
        condition: service_started
    networks:
      - network1
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:${INTERNAL_PORT}/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  azurite:
    container_name: azurite
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data
    volumes:
      - azurite-data:/data
    ports:
      - ${AZURITE_BLOB_PORT}:10000
    networks:
      - network1
    restart: unless-stopped

  localstack:
    container_name: localstack
    image: localstack/localstack:4.8.0
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    ports:
      - ${LOCALSTACK_PORT}:4566
    volumes:
      - localstack-data:/var/lib/localstack
    networks:
      - network1
    restart: unless-stopped

  web:
    container_name: web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - ${WEB_EXTERNAL_PORT}:${WEB_INTERNAL_PORT}
    networks:
      - network1
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False" # required to mount the servers.json file
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False" # Avoid master password prompt
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - network1
    restart: unless-stopped
    profiles: ["dev"]

networks:
  network1:
    driver: bridge

volumes:
  db:
  pgadmin:
  azurite-data:
  localstack-data:
