name: nextjs
services:
  db:
    container_name: db
    image: postgres:18.3
    volumes:
      # - db:/data/postgres # enable this line to persist data
      - ./database/init:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /data/postgres
    ports:
      - ${DB_EXTERNAL_PORT}:${DB_INTERNAL_PORT}
    networks:
      - network1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $DB_USER -d $DB_NAME"]
      start_period: 30s
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    container_name: liquibase
    image: liquibase/liquibase:5.0.1
    entrypoint:
      [
        "sh",
        "-c",
        "liquibase lpm list | grep postgresql || liquibase lpm add postgresql --global; liquibase update",
      ]
    # contexts: dev to seed data in dev environment
    command: --defaultsFile=liquibase.properties --contexts=dev update
    volumes:
      - ./database/liquibase.properties:/liquibase/liquibase.properties
      - ./database/changelog.yaml:/liquibase/changelog/changelog.yaml
      - ./database/sql:/liquibase/changelog/sql
      - ./database/seed:/liquibase/changelog/seed
      - ./database/dev:/liquibase/changelog/dev
    environment:
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://db:${DB_INTERNAL_PORT}/${DB_NAME}
      - LIQUIBASE_COMMAND_USERNAME=${DB_USER}
      - LIQUIBASE_COMMAND_PASSWORD=${DB_PASSWORD}
    networks:
      - network1
    depends_on:
      db:
        condition: service_healthy

  api:
    container_name: api
    build:
      context: ./api
      dockerfile: App.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=db;Port=${DB_INTERNAL_PORT};Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
      - ObjectStorage__ServiceUrl=http://garage:3900
      - ObjectStorage__PublicServiceUrl=http://localhost:${GARAGE_S3_PORT}
      - ObjectStorage__AccessKey=${GARAGE_DEFAULT_ACCESS_KEY}
      - ObjectStorage__SecretKey=${GARAGE_DEFAULT_SECRET_KEY}
      - ObjectStorage__Bucket=${GARAGE_DEFAULT_BUCKET}
    ports:
      - ${EXTERNAL_PORT}:${INTERNAL_PORT}
    depends_on:
      db:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
      garage:
        condition: service_started
    networks:
      - network1
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:${INTERNAL_PORT}/health || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  garage:
    container_name: garage
    image: dxflrs/garage:v2.3.0
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      - GARAGE_DEFAULT_ACCESS_KEY=${GARAGE_DEFAULT_ACCESS_KEY}
      - GARAGE_DEFAULT_SECRET_KEY=${GARAGE_DEFAULT_SECRET_KEY}
      - GARAGE_DEFAULT_BUCKET=${GARAGE_DEFAULT_BUCKET}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    ports:
      - ${GARAGE_S3_PORT}:3900
      - ${GARAGE_ADMIN_PORT}:3903
    networks:
      - network1
    restart: unless-stopped

  web:
    container_name: web
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - ${WEB_EXTERNAL_PORT}:${WEB_INTERNAL_PORT}
    networks:
      - network1
    restart: unless-stopped

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False" # required to mount the servers.json file
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False" # Avoid master password prompt
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json
    ports:
      - "${PGADMIN_PORT}:80"
    networks:
      - network1
    restart: unless-stopped
    profiles: ["dev"]

networks:
  network1:
    driver: bridge

volumes:
  db:
  pgadmin:
  garage-meta:
  garage-data:
