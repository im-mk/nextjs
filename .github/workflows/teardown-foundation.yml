name: Teardown Foundation

# DESTRUCTIVE: deletes the shared foundation resource group.
# Branch preview resource groups are not removed here.
on:
    workflow_dispatch:
        inputs:
            confirm_resource_group:
                description: "Type the exact resource group name to confirm deletion of ALL resources (DB, storage, apps, everything)"
                required: true

permissions:
    id-token: write # Azure OIDC
    contents: read

jobs:
    teardown:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Verify confirmation
              run: |
                  RESOURCE_GROUP="${{ vars.AZURE_RESOURCE_GROUP }}"
                  if [[ "${{ inputs.confirm_resource_group }}" != "$RESOURCE_GROUP" ]]; then
                    echo "::error::confirm_resource_group ('${{ inputs.confirm_resource_group }}') does not match AZURE_RESOURCE_GROUP ('$RESOURCE_GROUP')."
                    exit 1
                  fi

            - name: Log in to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Delete resource group
              run: az group delete -n "${{ vars.AZURE_RESOURCE_GROUP }}" --yes
