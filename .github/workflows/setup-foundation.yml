name: Setup Foundation

# Provisions the shared foundation.
# Safe to re-run for infra updates.
on:
  workflow_dispatch: {}

permissions:
  id-token: write # Azure OIDC
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub environment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          DB_ADMIN_PASSWORD: ${{ secrets.DB_ADMIN_PASSWORD }}
        run: |
          missing=0

          require_secret() {
            if [ -z "$2" ]; then
              echo "Missing GitHub secret: $1"
              missing=1
            fi
          }

          require_variable() {
            if [ -z "$2" ]; then
              echo "Missing GitHub variable: $1"
              missing=1
            fi
          }

          require_secret "AZURE_CLIENT_ID" "$AZURE_CLIENT_ID"
          require_secret "AZURE_TENANT_ID" "$AZURE_TENANT_ID"
          require_secret "AZURE_SUBSCRIPTION_ID" "$AZURE_SUBSCRIPTION_ID"
          require_variable "AZURE_RESOURCE_GROUP" "$AZURE_RESOURCE_GROUP"
          require_secret "DB_ADMIN_PASSWORD" "$DB_ADMIN_PASSWORD"

          if [ "$missing" -ne 0 ]; then
            echo "Configure the missing values in GitHub -> Settings -> Environments -> production."
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy foundation via Bicep
        run: |
          az deployment sub create -l "${{ vars.AZURE_LOCATION || 'uksouth' }}" -f infra/azure/subscription.bicep \
            -p resourceGroupName="${{ vars.AZURE_RESOURCE_GROUP }}" \
               location="${{ vars.AZURE_LOCATION || 'uksouth' }}" \
               dbAdminPassword="${{ secrets.DB_ADMIN_PASSWORD }}"
