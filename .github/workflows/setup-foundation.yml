name: Setup Foundation

# Provisions the shared foundation.
# Safe to re-run for infra updates.
on:
    workflow_dispatch: {}

permissions:
    id-token: write # Azure OIDC
    contents: read

jobs:
    setup:
        runs-on: ubuntu-latest
        environment: production
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to Azure
              uses: azure/login@v2
              with:
                  client-id: ${{ secrets.AZURE_CLIENT_ID }}
                  tenant-id: ${{ secrets.AZURE_TENANT_ID }}
                  subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

            - name: Deploy foundation via Bicep
              run: |
                  az deployment sub create -l "${{ vars.AZURE_LOCATION || 'uksouth' }}" -f infra/azure/subscription.bicep \
                    -p resourceGroupName="${{ vars.AZURE_RESOURCE_GROUP }}" \
                       location="${{ vars.AZURE_LOCATION || 'uksouth' }}" \
                       dbAdminPassword="${{ secrets.DB_ADMIN_PASSWORD }}" \
                       garageAccessKey="${{ secrets.GARAGE_ACCESS_KEY }}" \
                       garageSecretKey="${{ secrets.GARAGE_SECRET_KEY }}" \
                       garageRpcSecret="${{ secrets.GARAGE_RPC_SECRET }}" \
                       garageAdminToken="${{ secrets.GARAGE_ADMIN_TOKEN }}"
