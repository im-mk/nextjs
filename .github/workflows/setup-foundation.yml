name: Setup Foundation

# Provisions the shared foundation.
# Safe to re-run for infra updates.
on:
  workflow_dispatch: {}

permissions:
  id-token: write # Azure OIDC
  contents: read

env:
  AZURE_LOCATION: ${{ vars.AZURE_LOCATION || 'uksouth' }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP || 'nextjs' }}

jobs:
  setup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate GitHub environment configuration
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=0

          require_secret() {
            if [ -z "$2" ]; then
              echo "Missing GitHub secret: $1"
              missing=1
            fi
          }

          require_secret "AZURE_CLIENT_ID" "$AZURE_CLIENT_ID"
          require_secret "AZURE_TENANT_ID" "$AZURE_TENANT_ID"
          require_secret "AZURE_SUBSCRIPTION_ID" "$AZURE_SUBSCRIPTION_ID"

          if [ "$missing" -ne 0 ]; then
            echo "Configure the missing values in GitHub -> Settings -> Environments -> production."
            exit 1
          fi

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy foundation via Bicep
        run: |
          RESOURCE_GROUP="$AZURE_RESOURCE_GROUP"
          KEY_VAULT_NAME=$(az deployment group show -g "$RESOURCE_GROUP" -n foundation --query properties.outputs.keyVaultName.value -o tsv 2>/dev/null || true)

          if [ -n "$KEY_VAULT_NAME" ]; then
            DB_ADMIN_PASSWORD=$(az keyvault secret show --vault-name "$KEY_VAULT_NAME" --name database-admin-password --query value -o tsv 2>/dev/null || true)
          else
            DB_ADMIN_PASSWORD=''
          fi

          if [ -z "$DB_ADMIN_PASSWORD" ]; then
            DB_ADMIN_PASSWORD=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 32)
          fi

          echo "::add-mask::$DB_ADMIN_PASSWORD"

          az deployment sub create -l "$AZURE_LOCATION" -f infra/azure/subscription.bicep \
            -p resourceGroupName="$RESOURCE_GROUP" \
            location="$AZURE_LOCATION" \
               dbAdminPassword="$DB_ADMIN_PASSWORD"
